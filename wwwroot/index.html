<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebChat Room</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Màn hình đăng nhập -->
    <div id="login-overlay" class="overlay">
        <div class="login-card">
            <div class="brand-badge">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
            </div>
            <span class="status-pill">● Máy chủ trực tuyến</span>
            <h2>WebChat Room</h2>
            <p>Nhập tên hiển thị để tham gia cuộc trò chuyện</p>
            <input type="text" id="username-input" placeholder="Biệt danh của bạn (VD: Truong)..." maxlength="20" autocomplete="off">
            <button id="login-btn">Tham gia phòng chat</button>
            <p id="login-error" class="error-text"></p>
        </div>
    </div>

    <!-- Giao diện chính -->
    <div id="app-container" class="app-container hidden">
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="me-badge">
                    <div id="my-avatar" class="avatar avatar-sm">U</div>
                    <span id="current-user-label" class="me-name">User</span>
                </div>
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" placeholder="Tìm kiếm phòng hoặc người dùng..." autocomplete="off">
                </div>
            </div>

            <div class="sidebar-scroll">
                <div class="section-header">
                    <span>KÊNH & PHÒNG CHAT</span>
                    <button id="create-room-btn" title="Tạo phòng chat mới">+</button>
                </div>
                <ul id="room-list" class="chat-list"></ul>

                <div class="section-header">
                    <span>ĐANG TRỰC TUYẾN (<span id="online-count">0</span>)</span>
                </div>
                <ul id="user-list" class="chat-list"></ul>
            </div>
        </aside>

        <main class="chat-main">
            <header class="chat-header">
                <div class="header-peer">
                    <div id="header-avatar" class="avatar avatar-md">#</div>
                    <div class="header-info">
                        <h3 id="chat-title">General</h3>
                        <span id="chat-subtitle" class="subtitle">Phòng chat nhóm</span>
                    </div>
                </div>
                <div id="typing-indicator" class="typing-indicator"></div>
            </header>

            <div id="messages-box" class="messages-box"></div>

            <div id="emoji-bar" class="emoji-bar hidden">
                <span class="emoji-item">👍</span>
                <span class="emoji-item">❤️</span>
                <span class="emoji-item">😂</span>
                <span class="emoji-item">🔥</span>
                <span class="emoji-item">😮</span>
                <span class="emoji-item">😢</span>
                <span class="emoji-item">🎉</span>
                <span class="emoji-item">🙏</span>
                <span class="emoji-item">💻</span>
                <span class="emoji-item">🚀</span>
            </div>

            <form id="chat-form" class="chat-input-area">
                <input type="file" id="file-input" class="hidden">
                <button type="button" id="emoji-toggle-btn" class="icon-btn" title="Emoji">😊</button>
                <button type="button" id="attach-btn" class="icon-btn" title="Đính kèm ảnh hoặc tệp">📎</button>
                <input type="text" id="message-input" placeholder="Nhắn tin..." autocomplete="off">
                <button type="submit" class="send-btn" title="Gửi">➤</button>
            </form>
        </main>
    </div>

    <script src="chat.js"></script>
</body>
</html>
